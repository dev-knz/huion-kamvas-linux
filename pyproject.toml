[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kamvas-bridge"
version = "0.1.0"
description = "Linux diagnostics for the Huion Kamvas 13 Gen 3 dials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kamvas-bridge = "kamvas_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
